<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <!-- Google Fonts: Great Vibes, Cormorant Garamond, Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-color: #ffffff;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: #000000; /* Dark base prevents flash during transitions */
        }

        body {
            background-image: url('img/download (11).png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-color);
            font-family: 'Cormorant Garamond', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            /* Full page opacity setup */
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        /* Active page fade states */
        body.fade-in {
            opacity: 1 !important;
        }

        body.fade-out {
            opacity: 0 !important;
        }

        /* Ambient Glow Effect Animation Behind Glass Card */
        @keyframes subtleGlow {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(212, 175, 55, 0.15);
            }
            50% {
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 35px rgba(212, 175, 55, 0.35);
            }
        }

        /* Glass Card Container */
        .invite {
            text-align: center;
            max-width: 650px;
            width: 100%;
            padding: 50px 30px;
            background: rgba(52, 46, 27, 0.557);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 4px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
            animation: subtleGlow 6s infinite ease-in-out;
        }

        /* Keyframes for Staggered Entrance Animations */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes expandDivider {
            0% {
                opacity: 0;
                width: 0%;
            }
            100% {
                opacity: 1;
                width: 100%;
            }
        }

        @keyframes pulseStar {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* Applied Entrance Classes */
        .pre-header {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.2s;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 0 auto 30px auto;
            max-width: 200px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            width: 0%;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            animation: expandDivider 1s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.4s;
        }

        .divider span {
            color: var(--gold);
            font-size: 1rem;
            opacity: 0;
            display: inline-block;
            animation: fadeInUp 0.6s ease forwards 0.5s, pulseStar 3s infinite ease-in-out 1.2s;
        }

        .invite p.main-text {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #ffffff 0%, #fef3c7 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.9));

            opacity: 0;
            animation: fadeInUp 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.6s;
        }

        .button-group {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;

            opacity: 0;
            animation: fadeInUp 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.8s;
        }

        .button-group a {
            text-decoration: none;
        }

        .invite button {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 14px 38px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            background: transparent;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .btn-accept {
            color: #ffffff;
            border: 1px solid var(--gold);
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-accept:hover {
            background-color: var(--gold);
            color: #1a1a1a;
            box-shadow: 0 0 25px var(--gold-glow);
            transform: translateY(-2px);
        }

        .btn-accept:active {
            transform: translateY(0) scale(0.97);
        }

        .btn-decline {
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
        }

        .btn-decline:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-decline:active {
            transform: translateY(0) scale(0.97);
        }

        /* Falling Glitter & Hearts Animation Layer */
        .falling-sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .sparkle, .floating-heart {
            position: absolute;
            top: -10vh;
            animation: fallAnimation linear infinite;
        }

        /* Golden Sparkles */
        .sparkle {
            background: radial-gradient(circle, #f3e5ab 0%, #e2c088 60%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 6px #e2c088;
        }

        /* Floating Hearts / Petals */
        .floating-heart {
            font-size: 14px;
            color: rgba(226, 192, 136, 0.6);
            user-select: none;
        }

        
        @keyframes fallAnimation {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Randomizer positioning & delays for smooth particle stream */
        .sparkle:nth-child(1) { left: 5%; width: 6px; height: 6px; animation-duration: 7s; animation-delay: 0s; }
        .sparkle:nth-child(2) { left: 15%; width: 4px; height: 4px; animation-duration: 9s; animation-delay: 2s; }
        .sparkle:nth-child(3) { left: 25%; width: 7px; height: 7px; animation-duration: 6s; animation-delay: 1s; }
        .sparkle:nth-child(4) { left: 35%; width: 5px; height: 5px; animation-duration: 8s; animation-delay: 3s; }
        .sparkle:nth-child(5) { left: 45%; width: 6px; height: 6px; animation-duration: 10s; animation-delay: 0.5s; }
        .sparkle:nth-child(6) { left: 55%; width: 4px; height: 4px; animation-duration: 7s; animation-delay: 2.5s; }
        .sparkle:nth-child(7) { left: 65%; width: 7px; height: 7px; animation-duration: 9s; animation-delay: 1.5s; }
        .sparkle:nth-child(8) { left: 75%; width: 5px; height: 5px; animation-duration: 6s; animation-delay: 3.5s; }
        .sparkle:nth-child(9) { left: 85%; width: 6px; height: 6px; animation-duration: 8s; animation-delay: 0.8s; }
        .sparkle:nth-child(10) { left: 95%; width: 4px; height: 4px; animation-duration: 11s; animation-delay: 2s; }

        .floating-heart:nth-child(11) { left: 10%; animation-duration: 9s; animation-delay: 1s; font-size: 16px; }
        .floating-heart:nth-child(12) { left: 30%; animation-duration: 12s; animation-delay: 3s; font-size: 12px; }
        .floating-heart:nth-child(13) { left: 50%; animation-duration: 8s; animation-delay: 0.5s; font-size: 15px; }
        .floating-heart:nth-child(14) { left: 70%; animation-duration: 10s; animation-delay: 2s; font-size: 13px; }
        .floating-heart:nth-child(15) { left: 90%; animation-duration: 11s; animation-delay: 1.5s; font-size: 17px; }


        @media (max-width: 500px) {
            .invite {
                padding: 35px 20px;
            }
            .invite p.main-text {
                font-size: 2.3rem;
                margin-bottom: 30px;
            }
            .button-group {
                flex-direction: column;
                gap: 15px;
            }
            .invite button {
                width: 100%;
                max-width: 240px;
            }
        }
    </style>
</head>
<body>

     <!-- Falling Glitter and Heart Elements -->
    <div class="falling-sparkles">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="floating-heart">❤</div>
        <div class="floating-heart">♥</div>
        <div class="floating-heart">❤</div>
        <div class="floating-heart">♥</div>
        <div class="floating-heart">❤</div>
    </div>

    <div class="invite">
        <div class="pre-header">You Are Cordially Invited</div>
        <div class="divider">
            <span>✦</span>
        </div>
        
        <p class="main-text">We would like to invite you to join our wedding celebration.</p>
        
        <div class="button-group">
            <a href="home.html" id="accept-link">
                <button class="btn-accept">Accept</button>
            </a>
            <button class="btn-decline" id="decline-btn">Decline</button>
            
        </div>
    </div>

    <script>
        function triggerFadeIn() {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.body.classList.add('fade-in');
                });
            });
        }

        // Trigger initial page load fade-in
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
            triggerFadeIn();
        } else {
            window.addEventListener('DOMContentLoaded', triggerFadeIn);
        }

        // Handle page restores / back button
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) {
                document.body.classList.remove('fade-out');
                document.body.classList.add('fade-in');
            }
        });

        // Fade out on Accept click
        document.getElementById('accept-link').addEventListener('click', function(e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');

            document.body.classList.remove('fade-in');
            document.body.classList.add('fade-out');

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 800);
        });

        // Smooth decline action transition
        document.getElementById('decline-btn').addEventListener('click', function() {
            document.body.classList.remove('fade-in');
            document.body.classList.add('fade-out');
        });
    </script>

</body>
</html>
