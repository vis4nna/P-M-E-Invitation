<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>សិរីមង្គលអាពាហ៍ពិពាហ៍ - Pete & Moo</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Kantumruy+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-burgundy: #5d1624; /* Deep Burgundy */
            --cream-text: #f9f4ec;  /* Soft Warm Cream */
            --accent-gold: #e2c088; /* Gold Accent */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #000000; /* Dark base prevents flash during transitions */
            overflow-x: hidden;
        }

        body {
            /* Replace with your background image path */
            background-image: url('img/download\ \(11\).png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Kantumruy Pro', sans-serif;
            color: var(--cream-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;

            /* Page fade-in transition setup */
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        /* Class added by JS on load */
        body.fade-in {
            opacity: 1;
        }

        

        /* Ambient Glow Effect Animation Behind Invitation Card */
        @keyframes cardGlow {
            0%, 100% {
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 15px rgba(226, 192, 136, 0.2);
            }
            50% {
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(226, 192, 136, 0.4);
            }
        }

        .invitation-card {
            width: 100%;
            max-width: 900px;
            background-color: var(--cream-text);
            border: 2px solid rgba(226, 192, 136, 0.5);
            border-radius: 8px;
            padding: 60px 40px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
            position: relative;
            z-index: 10;
            animation: cardGlow 5s infinite ease-in-out;
            transform: translateY(20px);
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1) 0.3s;
        }

        body.fade-in .invitation-card {
            transform: translateY(0);
            opacity: 1;
        }

        /* Left Side: Names & Details */
        .left-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .wedding-title {
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-family: 'Cinzel', serif;
            color: var(--bg-burgundy);
        }

        .couple-names {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 10px;
            color: var(--bg-burgundy);
        }

        .couple-names .ampersand {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            display: inline-block;
            margin: 0 10px;
            color: var(--bg-burgundy);
            font-weight: 400;
        }

        .invite {
            font-size: 1.2rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            color: var(--bg-burgundy);
            opacity: 0.9;
        }

        .event-info-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            border-top: 1px solid rgba(93, 22, 36, 0.2);
            padding-top: 20px;
        }

        .date-block, .location-block {
            font-size: 0.95rem;
            line-height: 1.5;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--bg-burgundy);
        }

        .date-block strong, .location-block strong {
            color: var(--bg-burgundy);
            font-weight: 600;
        }

        .divider-line {
            width: 1px;
            height: 40px;
            background-color: var(--bg-burgundy);
            opacity: 0.4;
        }

        /* Right Side Art */
        .right-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid rgba(93, 22, 36, 0.15);
            padding-left: 40px;
            height: 100%;
            position: relative;
        }

        .right-content img {
            width: 100%;
            max-width: 280px;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.15));
            transition: transform 0.5s ease;
        }

        .right-content img:hover {
            transform: scale(1.03);
        }

        .rsvp-btn {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--bg-burgundy);
            text-decoration: none;
            text-transform: uppercase;
            position: absolute;
            bottom: 20px;
            right: 40px;
            transition: opacity 0.3s ease;
        }

        .rsvp-btn:hover {
            opacity: 0.7;
        }

        /* Falling Glitter & Hearts Animation Layer */
        .falling-sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .sparkle, .floating-heart {
            position: absolute;
            top: -10vh;
            animation: fallAnimation linear infinite;
        }

        /* Golden Sparkles */
        .sparkle {
            background: radial-gradient(circle, #f3e5ab 0%, #e2c088 60%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 6px #e2c088;
        }

        /* Floating Hearts / Petals */
        .floating-heart {
            font-size: 14px;
            color: rgba(226, 192, 136, 0.6);
            user-select: none;
        }

        @keyframes fallAnimation {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Randomizer positioning & delays for smooth particle stream */
        .sparkle:nth-child(1) { left: 5%; width: 6px; height: 6px; animation-duration: 7s; animation-delay: 0s; }
        .sparkle:nth-child(2) { left: 15%; width: 4px; height: 4px; animation-duration: 9s; animation-delay: 2s; }
        .sparkle:nth-child(3) { left: 25%; width: 7px; height: 7px; animation-duration: 6s; animation-delay: 1s; }
        .sparkle:nth-child(4) { left: 35%; width: 5px; height: 5px; animation-duration: 8s; animation-delay: 3s; }
        .sparkle:nth-child(5) { left: 45%; width: 6px; height: 6px; animation-duration: 10s; animation-delay: 0.5s; }
        .sparkle:nth-child(6) { left: 55%; width: 4px; height: 4px; animation-duration: 7s; animation-delay: 2.5s; }
        .sparkle:nth-child(7) { left: 65%; width: 7px; height: 7px; animation-duration: 9s; animation-delay: 1.5s; }
        .sparkle:nth-child(8) { left: 75%; width: 5px; height: 5px; animation-duration: 6s; animation-delay: 3.5s; }
        .sparkle:nth-child(9) { left: 85%; width: 6px; height: 6px; animation-duration: 8s; animation-delay: 0.8s; }
        .sparkle:nth-child(10) { left: 95%; width: 4px; height: 4px; animation-duration: 11s; animation-delay: 2s; }

        .floating-heart:nth-child(11) { left: 10%; animation-duration: 9s; animation-delay: 1s; font-size: 16px; }
        .floating-heart:nth-child(12) { left: 30%; animation-duration: 12s; animation-delay: 3s; font-size: 12px; }
        .floating-heart:nth-child(13) { left: 50%; animation-duration: 8s; animation-delay: 0.5s; font-size: 15px; }
        .floating-heart:nth-child(14) { left: 70%; animation-duration: 10s; animation-delay: 2s; font-size: 13px; }
        .floating-heart:nth-child(15) { left: 90%; animation-duration: 11s; animation-delay: 1.5s; font-size: 17px; }

        /* Responsive Design */
        @media (max-width: 768px) {
            .invitation-card {
                grid-template-columns: 1fr;
                padding: 40px 20px;
                text-align: center;
            }
            .couple-names {
                font-size: 2.8rem;
            }
            .event-info-row {
                justify-content: center;
            }
            .right-content {
                border-left: none;
                border-top: 1px solid rgba(93, 22, 36, 0.15);
                padding-left: 0;
                padding-top: 30px;
            }
            .rsvp-btn {
                position: relative;
                bottom: auto;
                right: auto;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Falling Glitter and Heart Elements -->
    <div class="falling-sparkles">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="floating-heart">❤</div>
        <div class="floating-heart">♥</div>
        <div class="floating-heart">❤</div>
        <div class="floating-heart">♥</div>
        <div class="floating-heart">❤</div>
    </div>

    <div class="invitation-card">
        <!-- Left Side Details -->
        <div class="left-content">
            <div class="wedding-title">Wedding Invitation</div>
            <h1 class="couple-names">
                Pete <span class="ampersand">&</span> Moo
            </h1>
            <div class="invite">You have been invited to our wedding</div>

            <div class="event-info-row">
                <div class="date-block">
                    <strong>11 DECEMBER 2026</strong><br>
                    <span>5:00 PM</span>
                </div>
                <div class="divider-line"></div>
                <div class="location-block">
                    <strong>THE GRAND TERRACE</strong><br>
                    <span>(Building A & B)</span>
                </div>
            </div>

            <a href="info.html" class="rsvp-btn">See More Info</a>
        </div>

        <!-- Right Side Art -->
        <div class="right-content">
            <img src="img/Screenshot 2026-10-17 155544-Photoroom.png" alt="Wedding Illustration">
        </div>
    </div>
    

    <!-- Script to trigger fade-in on load -->
    <script>
        function triggerFadeIn() {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.body.classList.add('fade-in');
                });
            });
        }

        if (document.readyState === 'interactive' || document.readyState === 'complete') {
            triggerFadeIn();
        } else {
            window.addEventListener('DOMContentLoaded', triggerFadeIn);
        }

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                document.body.classList.add('fade-in');
            }
        });
        window.addEventListener('load', () => {
        setTimeout(() => {
        document.body.classList.add('fade-out');
        setTimeout(() => {
            window.location.href = 'info.html';
        }, 2000); // Match the body's 2-second opacity transition
    }, 3000);
});
    </script>

</body>
</html>
